
{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Веб-приложение{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{% static 'project_first_app/css/style.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'accounts/css/auth.css' %}"
    >
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="{% url 'flights:flight_list' %}">
                FlightBoard
            </a>

            <div class="nav-links">
                <a href="{% url 'flights:flight_list' %}">
                    Рейсы
                </a>

                <a href="{% url 'project_first_app:car_list' %}">
                    Автомобили
                </a>

                <a href="{% url 'project_first_app:owner_list' %}">
                    Владельцы
                </a>
            </div>

            <div class="nav-account">
                {% if user.is_authenticated %}
                    <span class="user-name">
                        {{ user.username }}
                    </span>

                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}

                        <button class="logout-button" type="submit">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">
                        Войти
                    </a>

                    <a href="{% url 'accounts:register' %}">
                        Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
